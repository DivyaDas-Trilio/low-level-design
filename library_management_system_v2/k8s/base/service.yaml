apiVersion: v1
kind: Service
metadata:
  name: lms
  namespace: lms
  labels:
    app: lms
spec:
  # No `type` here (defaults to ClusterIP). Each overlay patches the type:
  #   baremetal → NodePort,  eks → LoadBalancer.
  selector:
    app: lms
  ports:
    - name: http
      port: 80
      targetPort: http
