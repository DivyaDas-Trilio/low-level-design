[project]
name = "library-management-system"
version = "0.1.0"
description = "Library Management System — DDD 0→1 build"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov"]
# Production server (invoked as a command, not imported) — pinned in requirements.txt
prod = ["gunicorn>=23.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=0"
